name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 查看仓库文件
        run: dir

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖库
        run: |
          pip install pyautogui keyboard pynput numpy pillow pyinstaller

      - name: 打包 EXE
        run: |
          pyinstaller --onefile --name "auto-clicker" ad_auto_clicker_detect.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: auto-clicker-exe
          path: dist/auto-clicker.exe
